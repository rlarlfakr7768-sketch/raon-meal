name: 급식 자동 게시 (중단됨)

# 2026-08-16 급식 게시 잠정 중단. 예약을 끄고 수동 실행만 남겼다.
# 다시 켜려면 아래 cron 두 줄의 주석을 풀고, 로컬 작업 'Meal Local'도 사용으로 바꾸면 된다.
on:
  # schedule:
  #   로컬(05:30)보다 뒤인 06:08/06:38 KST에 떠서, 로컬이 이미 올렸으면 meal_last.txt 마커로 스킵.
  #   - cron: '8 21 * * *'
  #   - cron: '38 21 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 파이썬 의존성 + 크로뮴 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: secrets.json 작성 (GitHub Secret에서)
        env:
          IG_SECRETS_JSON: ${{ secrets.IG_SECRETS_JSON }}
        run: printf '%s' "$IG_SECRETS_JSON" > secrets.json

      - name: 급식 게시
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: python cloud_run.py

      - name: 갱신된 토큰을 Secret에 다시 저장 (GH_PAT 있을 때만)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT 미설정 — 토큰 자동갱신 저장 생략(약 60일마다 IG_SECRETS_JSON 재설정 필요)"
            exit 0
          fi
          gh secret set IG_SECRETS_JSON --repo "$GITHUB_REPOSITORY" < secrets.json
